services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rtc_root_dev_password
      MYSQL_DATABASE: real_time_collab
      MYSQL_USER: rtc
      MYSQL_PASSWORD: rtc_dev_password
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prtc_root_dev_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: